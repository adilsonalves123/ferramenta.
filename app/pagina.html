<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ferramenta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
      background: #10110f;
      color: #f5f5f5;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p.ajuda { color: #a3a3a3; margin: 0 0 24px; }
    .opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .opcoes { grid-template-columns: 1fr; } }
    button.opcao {
      text-align: left;
      border: 0;
      border-radius: 18px;
      background: #1c1e1a;
      color: white;
      padding: 0 0 14px;
      cursor: pointer;
      font: inherit;
      overflow: hidden;
    }
    button.opcao img { width: 100%; height: 168px; object-fit: cover; display: block; }
    button.opcao strong { display: block; font-size: 17px; padding: 12px 14px 0; }
    button.opcao span { display: block; margin-top: 4px; padding: 0 14px; color: #a3a3a3; font-size: 14px; }
    button.opcao:hover { outline: 1px solid #c6ff3d; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-radius: 12px;
      background: #1c1e1a;
      color: white;
      padding: 14px 16px;
      font: inherit;
    }
    button.principal {
      margin-top: 20px;
      height: 48px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: #c6ff3d;
      color: #111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.principal:disabled { opacity: 0.7; cursor: wait; }
    button.principal { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(17, 17, 17, 0.25);
      border-top-color: #111;
      border-radius: 50%;
      animation: girar 0.7s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    input[type="file"] { padding: 10px 14px; }
    p.secao { margin: 22px 0 10px; font-size: 14px; font-weight: 700; }
    .redes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.rede {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 1px solid #2a2c28;
      border-radius: 14px;
      background: #1c1e1a;
      color: #f5f5f5;
      padding: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.rede i { width: 22px; font-size: 20px; color: #a3a3a3; text-align: center; }
    button.rede:hover,
    button.rede:hover i { color: #c6ff3d; border-color: #6b8f22; }
    button.rede.selecionada {
      color: #c6ff3d;
      border-color: #c6ff3d;
      box-shadow: inset 0 0 0 1px #c6ff3d;
    }
    button.rede.selecionada i { color: #c6ff3d; }
    .tipos { display: grid; gap: 8px; }
    label.tipo {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      padding: 12px 14px;
      border: 1px solid #2a2c28;
      border-radius: 14px;
      background: #1c1e1a;
      cursor: pointer;
    }
    label.tipo input { width: auto; margin-top: 3px; accent-color: #c6ff3d; }
    label.tipo small { display: block; margin-top: 3px; color: #a3a3a3; font-weight: 400; }
    label.tipo:has(input:checked) {
      border-color: #c6ff3d;
      box-shadow: inset 0 0 0 1px #c6ff3d;
    }
    button.voltar, button.copiar {
      margin-top: 8px;
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid #c6ff3d;
      background: transparent;
      color: #c6ff3d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .erro { margin-top: 16px; color: #ff7a3c; }
    article {
      margin-top: 16px;
      background: #1c1e1a;
      border-radius: 16px;
      padding: 18px;
    }
    article h2 {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c6ff3d;
      margin: 0 0 12px;
    }
    article h3 { margin: 14px 0 4px; font-size: 15px; }
    article p, article li { white-space: pre-wrap; line-height: 1.45; margin: 0; }
    article ul { margin: 0; padding-left: 18px; }
    article li + li { margin-top: 10px; }
    article img, article video, article audio { width: 100%; border-radius: 12px; margin-top: 8px; background: #000; }
    a.baixar { display: inline-block; margin-top: 10px; color: #c6ff3d; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section id="menu">
      <h1>O que você quer fazer?</h1>
      <p class="ajuda">Escolha uma ferramenta. Só ela vai rodar.</p>
      <div class="opcoes">
        <button class="opcao" type="button" data-acao="texto">
          <img src="/quadros/anuncio.jpg" alt="Anúncio no celular" />
          <strong>Texto do anúncio</strong>
          <span>Título, legenda e roteiro.</span>
        </button>
        <button class="opcao" type="button" data-acao="foto">
          <img src="/quadros/foto.jpg" alt="Foto de produto" />
          <strong>Foto</strong>
          <span>Imagem do personagem para o post.</span>
        </button>
        <button class="opcao" type="button" data-acao="video">
          <img src="/quadros/video.jpg" alt="Pessoa gravando um vídeo" />
          <strong>Vídeo com voz</strong>
          <span>Personagem na imagem e a voz lendo o roteiro.</span>
        </button>
        <button class="opcao" type="button" data-acao="google">
          <img src="/quadros/google.jpg" alt="Fachada do negócio" />
          <strong>Google Meu Negócio</strong>
          <span>Nome, categoria e descrição prontos.</span>
        </button>
        <button class="opcao" type="button" data-acao="clonador">
          <img src="/quadros/clonador.jpg" alt="Celular com um vídeo no balcão" />
          <strong>Clonador de Vídeo Viral</strong>
          <span>Cole um link ou envie um vídeo de sucesso e a IA recria um roteiro adaptado para o seu produto.</span>
        </button>
        <button class="opcao" type="button" data-acao="radar">
          <img src="/quadros/radar.jpg" alt="Rua com pontos no mapa do celular" />
          <strong>Radar de Clientes B2B</strong>
          <span>Escolha as redes, a cidade e o tipo de busca.</span>
        </button>
      </div>
    </section>

    <section id="tarefa" hidden>
      <button class="voltar" type="button" id="voltar">Escolher outra</button>
      <h1 id="titulo-tarefa">Ferramenta</h1>
      <p class="ajuda" id="ajuda-tarefa"></p>
      <form id="formulario">
        <div id="campos-base">
          <label for="nicho_negocio">Nicho do negócio</label>
          <input id="nicho_negocio" name="nicho_negocio" required minlength="2" placeholder="Ex.: bar e petiscaria" />
          <label for="produto_servico">Produto ou serviço</label>
          <textarea id="produto_servico" name="produto_servico" required minlength="2" rows="3" placeholder="Ex.: combo de cerveja gelada no happy hour"></textarea>
        </div>
        <div id="campos-clonador" hidden>
          <label for="link_video">Link do vídeo</label>
          <input id="link_video" name="link_video" type="url" placeholder="https://www.instagram.com/reel/..." />
          <label for="arquivo_video">Ou envie o vídeo</label>
          <input id="arquivo_video" name="arquivo_video" type="file" accept="video/*" />
        </div>
        <div id="campos-radar" hidden>
          <label for="cidade">Cidade</label>
          <input id="cidade" name="cidade" minlength="2" placeholder="Ex.: Belo Horizonte" />
          <p class="secao">Onde você quer buscar?</p>
          <div class="redes" id="redes">
            <button class="rede" type="button" data-rede="instagram" aria-pressed="false"><i class="fa-brands fa-instagram" aria-hidden="true"></i>Instagram</button>
            <button class="rede" type="button" data-rede="tiktok" aria-pressed="false"><i class="fa-brands fa-tiktok" aria-hidden="true"></i>TikTok</button>
            <button class="rede" type="button" data-rede="facebook" aria-pressed="false"><i class="fa-brands fa-facebook" aria-hidden="true"></i>Facebook</button>
            <button class="rede" type="button" data-rede="google" aria-pressed="false"><i class="fa-solid fa-location-dot" aria-hidden="true"></i>Google Maps</button>
          </div>
          <p class="secao">Tipo de busca</p>
          <div class="tipos">
            <label class="tipo">
              <input type="radio" name="tipo_busca" value="geral" checked />
              <span>Busca Geral<small>Procura de forma ampla todas as empresas do nicho na cidade.</small></span>
            </label>
            <label class="tipo">
              <input type="radio" name="tipo_busca" value="determinada" />
              <span>Busca Determinada<small>Abre um campo para tags específicas, como proprietário, gerente ou compras.</small></span>
            </label>
          </div>
          <div id="campo-tags" hidden>
            <label for="tags">Tags</label>
            <input id="tags" name="tags" minlength="2" placeholder="Ex.: proprietário, gerente, compras" />
          </div>
        </div>
        <button class="principal" type="submit" id="enviar">
          <span class="spinner" id="spinner" hidden></span>
          <span id="enviar-texto">Gerar</span>
        </button>
      </form>
      <p class="erro" id="erro" hidden></p>
      <section id="resultado" hidden></section>
    </section>
  </main>
  <script>
    const FERRAMENTAS = {
      texto: {
        titulo: "Texto do anúncio",
        ajuda: "Gera o título, a legenda e o roteiro. Não cria foto nem vídeo.",
        botao: "Gerar texto",
        espera: "Escrevendo o anúncio",
      },
      foto: {
        titulo: "Foto",
        ajuda: "Gera só a imagem do personagem para o post.",
        botao: "Gerar foto",
        espera: "Criando a foto",
      },
      video: {
        titulo: "Vídeo com voz",
        ajuda: "Gera o vídeo com o personagem e a voz do roteiro. Pode levar cerca de um minuto.",
        botao: "Gerar vídeo",
        espera: "Montando o vídeo",
      },
      google: {
        titulo: "Google Meu Negócio",
        ajuda: "Gera nome, categoria e descrição. Não publica no Google daqui.",
        botao: "Gerar texto do Google",
      },
      clonador: {
        titulo: "Clonador de Vídeo Viral",
        ajuda: "O link ou o nome do arquivo entra como referência. A IA reescreve um roteiro novo para o seu produto. Ela não assiste o vídeo.",
        botao: "Reescrever roteiro",
      },
      radar: {
        titulo: "Radar de Clientes B2B",
        ajuda: "Escolha onde buscar e o tipo de busca. A tela mostra três exemplos fictícios.",
        botao: "Mapear exemplos",
      },
    };

    const menu = document.getElementById("menu");
    const tarefa = document.getElementById("tarefa");
    const formulario = document.getElementById("formulario");
    const enviar = document.getElementById("enviar");
    const enviarTexto = document.getElementById("enviar-texto");
    const spinner = document.getElementById("spinner");
    const erro = document.getElementById("erro");
    const resultado = document.getElementById("resultado");
    const camposBase = document.getElementById("campos-base");
    const camposClonador = document.getElementById("campos-clonador");
    const camposRadar = document.getElementById("campos-radar");
    let acao = "texto";

    function texto(valor) {
      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function mensagemErro(dados) {
      if (typeof dados?.detail === "string") return dados.detail;
      return "Não foi possível gerar agora.";
    }

    const redesEscolhidas = new Set();

    function exigir(id, ativo) {
      document.getElementById(id).required = ativo;
    }

    function tipoBusca() {
      return document.querySelector('input[name="tipo_busca"]:checked')?.value || "geral";
    }

    function atualizarTags() {
      const determinada = tipoBusca() === "determinada";
      document.getElementById("campo-tags").hidden = !determinada;
      exigir("tags", acao === "radar" && determinada);
    }

    function abrir(escolha) {
      acao = escolha;
      const item = FERRAMENTAS[escolha];
      document.getElementById("titulo-tarefa").textContent = item.titulo;
      document.getElementById("ajuda-tarefa").textContent = item.ajuda;
      enviarTexto.textContent = item.botao;
      camposBase.hidden = escolha === "radar";
      camposClonador.hidden = escolha !== "clonador";
      camposRadar.hidden = escolha !== "radar";
      exigir("nicho_negocio", escolha !== "radar");
      exigir("produto_servico", escolha !== "radar");
      exigir("cidade", escolha === "radar");
      exigir("tags", escolha === "radar" && tipoBusca() === "determinada");
      erro.hidden = true;
      resultado.hidden = true;
      spinner.hidden = true;
      menu.hidden = true;
      tarefa.hidden = false;
      atualizarTags();
    }

    function mostrarResultado(dados) {
      const roteiro = dados.roteiro_video;
      const google = dados.google_meu_negocio;
      const aviso = dados.aviso_midia ? `<p class="erro" style="display:block">${texto(dados.aviso_midia)}</p>` : "";
      let corpo = aviso;
      if (acao === "foto" && dados.foto_url) {
        corpo += `<article><h2>Foto</h2><img src="${texto(dados.foto_url)}" alt="Personagem do anúncio" /><a class="baixar" href="${texto(dados.foto_url)}" download>Baixar foto</a></article>`;
      }
      if (acao === "video" && dados.video_url) {
        corpo += `<article><h2>Vídeo</h2><video src="${texto(dados.video_url)}" controls></video><a class="baixar" href="${texto(dados.video_url)}" download>Baixar vídeo</a></article>`;
      }
      if (acao === "texto") {
        const anuncio = `${dados.titulo_anuncio}\n\n${dados.legenda_redes}`;
        corpo += `<article>
          <h2>Título e legenda</h2>
          <h3>Título</h3><p>${texto(dados.titulo_anuncio)}</p>
          <h3>Legenda</h3><p>${texto(dados.legenda_redes)}</p>
          <button class="copiar" type="button" id="copiar">Copiar texto</button>
        </article>
        <article><h2>Roteiro</h2><ul>
          <li><strong>Gancho.</strong> ${texto(roteiro.gancho)}</li>
          <li><strong>Problema.</strong> ${texto(roteiro.problema)}</li>
          <li><strong>Solução.</strong> ${texto(roteiro.solucao)}</li>
          <li><strong>CTA.</strong> ${texto(roteiro.cta)}</li>
        </ul></article>`;
        resultado.innerHTML = corpo;
        resultado.hidden = false;
        document.getElementById("copiar").addEventListener("click", async () => {
          await navigator.clipboard.writeText(anuncio);
          const botao = document.getElementById("copiar");
          botao.textContent = "Copiado";
          window.setTimeout(() => { botao.textContent = "Copiar texto"; }, 1600);
        });
        return;
      }
      if (acao === "google") {
        corpo += `<article><h2>Google Meu Negócio</h2><ul>
          <li><strong>Nome.</strong> ${texto(google.nome_otimizado)}</li>
          <li><strong>Categoria.</strong> ${texto(google.categoria)}</li>
          <li><strong>Descrição.</strong> ${texto(google.descricao_seo)}</li>
        </ul></article>`;
      }
      if (acao === "clonador") {
        corpo += `<article><h2>Roteiro reescrito</h2>
          <h3>Título</h3><p>${texto(dados.titulo)}</p>
          <p>Referência: ${texto(dados.referencia)}</p>
          <ul>
            <li><strong>Gancho.</strong> ${texto(dados.gancho)}</li>
            <li><strong>Retenção.</strong> ${texto(dados.retencao)}</li>
            <li><strong>Desenvolvimento.</strong> ${texto(dados.desenvolvimento)}</li>
            <li><strong>CTA.</strong> ${texto(dados.cta)}</li>
          </ul>
          <h3>Legenda</h3><p>${texto(dados.legenda)}</p>
        </article>`;
      }
      if (acao === "radar") {
        const itens = (dados.empresas || []).map((empresa) => `<li><strong>${texto(empresa.nome)}.</strong> ${texto(empresa.categoria)} em ${texto(empresa.bairro)}. ${texto(empresa.endereco)}. ${texto(empresa.telefone)}. ${texto(empresa.porque)}</li>`).join("");
        const redes = (dados.redes || []).join(", ");
        corpo += `<article><h2>Exemplos na região</h2><p>${texto(dados.aviso)}</p><p>${texto(dados.tipo_busca)} em ${texto(redes)}.</p><ul>${itens}</ul></article>`;
      }
      resultado.innerHTML = corpo;
      resultado.hidden = false;
    }

    document.querySelectorAll(".opcao").forEach((botao) => {
      botao.addEventListener("click", () => abrir(botao.dataset.acao));
    });

    document.getElementById("voltar").addEventListener("click", () => {
      tarefa.hidden = true;
      menu.hidden = false;
    });

    document.querySelectorAll(".rede").forEach((botao) => {
      botao.addEventListener("click", () => {
        const rede = botao.dataset.rede;
        if (redesEscolhidas.has(rede)) {
          redesEscolhidas.delete(rede);
          botao.classList.remove("selecionada");
          botao.setAttribute("aria-pressed", "false");
        } else {
          redesEscolhidas.add(rede);
          botao.classList.add("selecionada");
          botao.setAttribute("aria-pressed", "true");
        }
      });
    });

    document.querySelectorAll('input[name="tipo_busca"]').forEach((opcao) => {
      opcao.addEventListener("change", atualizarTags);
    });

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      erro.hidden = true;
      resultado.hidden = true;
      const arquivo = document.getElementById("arquivo_video").files[0];
      const link = document.getElementById("link_video").value.trim();
      if (acao === "clonador" && !link && !arquivo) {
        erro.textContent = "Cole um link ou escolha um vídeo.";
        erro.hidden = false;
        return;
      }
      spinner.hidden = false;
      enviar.disabled = true;
      let caminho = "/gerar-campanha";
      let corpo = {
        nicho_negocio: document.getElementById("nicho_negocio").value.trim(),
        produto_servico: document.getElementById("produto_servico").value.trim(),
        acao,
      };
      if (acao === "clonador") {
        caminho = "/clonar-video";
        corpo = {
          nicho_negocio: corpo.nicho_negocio,
          produto_servico: corpo.produto_servico,
          link_video: link,
          nome_arquivo: arquivo ? arquivo.name : "",
        };
      }
      if (acao === "radar") {
        if (redesEscolhidas.size === 0) {
          erro.textContent = "Escolha pelo menos uma rede.";
          erro.hidden = false;
          return;
        }
        const tags = document.getElementById("tags").value.trim();
        if (tipoBusca() === "determinada" && tags.length < 2) {
          erro.textContent = "Digite as tags da busca determinada.";
          erro.hidden = false;
          return;
        }
        caminho = "/radar-clientes";
        corpo = {
          cidade: document.getElementById("cidade").value.trim(),
          redes: [...redesEscolhidas],
          tipo_busca: tipoBusca(),
          tags,
        };
      }
      try {
        const resposta = await fetch(caminho, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(corpo),
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(mensagemErro(dados));
        mostrarResultado(dados);
      } catch (falha) {
        erro.textContent = falha.message || "Não foi possível gerar agora.";
        erro.hidden = false;
      } finally {
        spinner.hidden = true;
        enviar.disabled = false;
      }
    });
  </script>
</body>
</html>
